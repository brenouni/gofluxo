<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">Massali Hub — fluxo de gestão da concessionária</title><desc id="desc">Fluxo próprio do Hub · informação local ou autorizada; nenhum conector é requisito para documentar e validar esta frente</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#438369"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f5f7f1"/><text x="30" y="43" font-size="25" font-family="Arial,sans-serif" fill="#193d33" font-weight="700">Massali Hub — fluxo de gestão da concessionária</text><text x="30" y="74" font-size="16" font-family="Arial,sans-serif" fill="#536b60">Fluxo próprio do Hub · informação local ou autorizada; nenhum conector é requisito para documentar e validar esta frente</text><rect x="20" y="100" width="1400" height="205" rx="16" fill="#e7efdd"/><text x="40" y="133" font-size="16" font-family="Arial,sans-serif" fill="#284d3e" font-weight="700">ACESSO E CONTEXTO</text><rect x="20" y="325" width="1400" height="205" rx="16" fill="#e0eeed"/><text x="40" y="358" font-size="16" font-family="Arial,sans-serif" fill="#284d3e" font-weight="700">GESTÃO DA CARTEIRA</text><rect x="20" y="550" width="1400" height="205" rx="16" fill="#e8e8f6"/><text x="40" y="583" font-size="16" font-family="Arial,sans-serif" fill="#284d3e" font-weight="700">DECISÃO E ACOMPANHAMENTO</text><rect x="245" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="261" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Identificar usuário</text><text x="261" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Sessão, unidade e ações</text><text x="261" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">autorizadas</text><rect x="530" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="546" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Selecionar contexto</text><text x="546" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Concessionária e carteira</text><text x="546" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">permitidas</text><rect x="815" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="831" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Registrar compromisso</text><text x="831" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Veículo, vendedor e data</text><text x="831" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">prometida</text><rect x="1100" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="1116" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Qualificar informação</text><text x="1116" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Origem, responsável e última</text><text x="1116" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">atualização</text><rect x="245" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="261" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Consultar carteira</text><text x="261" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Busca e filtros por loja e</text><text x="261" y="455" font-size="14" font-family="Arial,sans-serif" fill="#51685c">situação</text><rect x="530" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="546" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Abrir veículo</text><text x="546" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Identidade, prazo e resumo da</text><text x="546" y="455" font-size="14" font-family="Arial,sans-serif" fill="#51685c">preparação</text><rect x="815" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="831" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Ler a jornada</text><text x="831" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Serviços, tarefas e</text><text x="831" y="455" font-size="14" font-family="Arial,sans-serif" fill="#51685c">evidências relevantes</text><rect x="1100" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="1116" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Identificar pendência</text><text x="1116" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">O que falta, quem age e qual</text><text x="1116" y="455" font-size="14" font-family="Arial,sans-serif" fill="#51685c">prazo</text><rect x="245" y="603" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="261" y="633" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Organizar prioridade</text><text x="261" y="660" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Ação gerencial e responsável</text><text x="261" y="680" font-size="14" font-family="Arial,sans-serif" fill="#51685c">definido</text><rect x="530" y="603" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="546" y="633" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Atualizar informação</text><text x="546" y="660" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Registro autorizado; motivo e</text><text x="546" y="680" font-size="14" font-family="Arial,sans-serif" fill="#51685c">versão</text><rect x="815" y="603" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="831" y="633" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Acompanhar entrega</text><text x="831" y="660" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Conclusão de serviço não</text><text x="831" y="680" font-size="14" font-family="Arial,sans-serif" fill="#51685c">significa entrega</text><rect x="1100" y="603" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="1116" y="633" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Medir resultado</text><text x="1116" y="660" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Pontualidade, adoção e</text><text x="1116" y="680" font-size="14" font-family="Arial,sans-serif" fill="#51685c">satisfação interna</text><path d="M495 210.5H521" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M780 210.5H806" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1065 210.5H1091" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1225.0 268V293H370.0V370" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M495 435.5H521" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M780 435.5H806" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1065 435.5H1091" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1225.0 493V518H370.0V595" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M495 660.5H521" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M780 660.5H806" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1065 660.5H1091" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="826" font-size="14" font-family="Arial,sans-serif" fill="#4e6559">Setas representam a lógica do desenho. Não indicam conectores já ativos. Correção retorna à etapa responsável.</text></svg>