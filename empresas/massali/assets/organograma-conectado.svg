<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1075" role="img" aria-labelledby="title desc"><title id="title">Massali — organograma do ecossistema conectado</title><desc id="desc">Visão-alvo do ecossistema conectado · conectores são uma entrega futura, sem bloquear as três frentes</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#438369"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f5f7f1"/><text x="30" y="43" font-size="25" font-family="Arial,sans-serif" fill="#193d33" font-weight="700">Massali — organograma do ecossistema conectado</text><text x="30" y="74" font-size="16" font-family="Arial,sans-serif" fill="#536b60">Visão-alvo do ecossistema conectado · conectores são uma entrega futura, sem bloquear as três frentes</text><rect x="20" y="100" width="1400" height="205" rx="16" fill="#e7efdd"/><text x="40" y="133" font-size="16" font-family="Arial,sans-serif" fill="#284d3e" font-weight="700">HUB · CONCESSIONÁRIA</text><rect x="20" y="325" width="1400" height="205" rx="16" fill="#e0eeed"/><text x="40" y="358" font-size="16" font-family="Arial,sans-serif" fill="#284d3e" font-weight="700">LINHA DO TEMPO · VEÍCULO</text><rect x="20" y="550" width="1400" height="205" rx="16" fill="#e8e8f6"/><text x="40" y="583" font-size="16" font-family="Arial,sans-serif" fill="#284d3e" font-weight="700">TECH · PRESTADORA</text><rect x="20" y="775" width="1400" height="205" rx="16" fill="#f3edda"/><text x="40" y="808" font-size="16" font-family="Arial,sans-serif" fill="#284d3e" font-weight="700">RETORNO · CONFERÊNCIA E EXPERIÊNCIA</text><rect x="245" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="261" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Venda e promessa</text><text x="261" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Unidade, veículo, prazo</text><text x="261" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">original e responsável</text><rect x="530" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="546" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Carteira e prioridade</text><text x="546" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Gestão vê pendência, próximo</text><text x="546" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">passo e compromisso</text><rect x="815" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="831" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Pedido autorizado</text><text x="831" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Especificação e prazo seguem</text><text x="831" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">para a jornada</text><rect x="1100" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="1116" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Gestão consolidada</text><text x="1116" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Lê acontecimentos autorizados</text><text x="1116" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">por veículo</text><rect x="245" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="261" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Receber e identificar</text><text x="261" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Registrar disponibilidade e</text><text x="261" y="455" font-size="14" font-family="Arial,sans-serif" fill="#51685c">condições de custódia</text><rect x="530" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="546" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Planejar a jornada</text><text x="546" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Etapas, dependências e</text><text x="546" y="455" font-size="14" font-family="Arial,sans-serif" fill="#51685c">serviços em paralelo</text><rect x="815" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="831" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Solicitar serviços</text><text x="831" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Conector futuro vincula</text><text x="831" y="455" font-size="14" font-family="Arial,sans-serif" fill="#51685c">pedido, item e executores</text><rect x="1100" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="1116" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Receber acontecimentos</text><text x="1116" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Aceite, início, conclusão e</text><text x="1116" y="455" font-size="14" font-family="Arial,sans-serif" fill="#51685c">evidências por item</text><rect x="245" y="603" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="261" y="633" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Confirmar viabilidade</text><text x="261" y="660" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Administrativo avalia</text><text x="261" y="680" font-size="14" font-family="Arial,sans-serif" fill="#51685c">condições e libera</text><rect x="530" y="603" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="546" y="633" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Distribuir e aceitar</text><text x="546" y="660" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Categoria, capacidade e</text><text x="546" y="680" font-size="14" font-family="Arial,sans-serif" fill="#51685c">responsável habilitado</text><rect x="815" y="603" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="831" y="633" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Executar e comprovar</text><text x="831" y="660" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Película e tapeçaria podem</text><text x="831" y="680" font-size="14" font-family="Arial,sans-serif" fill="#51685c">seguir em paralelo</text><rect x="1100" y="603" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="1116" y="633" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Encerrar cada item</text><text x="1116" y="660" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Registrar evidência; tratar</text><text x="1116" y="680" font-size="14" font-family="Arial,sans-serif" fill="#51685c">remuneração na Tech</text><rect x="245" y="828" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="261" y="858" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Conferir / corrigir</text><text x="261" y="885" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Checklist com evidências;</text><text x="261" y="905" font-size="14" font-family="Arial,sans-serif" fill="#51685c">pendência tem responsável</text><rect x="530" y="828" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="546" y="858" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Receber / liberar</text><text x="546" y="885" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Custódia e liberação</text><text x="546" y="905" font-size="14" font-family="Arial,sans-serif" fill="#51685c">separadas da entrega</text><rect x="815" y="828" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="831" y="858" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Entregar ao comprador</text><text x="831" y="885" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Acontecimento explícito pela</text><text x="831" y="905" font-size="14" font-family="Arial,sans-serif" fill="#51685c">concessionária</text><rect x="1100" y="828" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="1116" y="858" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Avaliar e aprender</text><text x="1116" y="885" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Pesquisa interna e</text><text x="1116" y="905" font-size="14" font-family="Arial,sans-serif" fill="#51685c">indicadores com base</text><text x="1116" y="925" font-size="14" font-family="Arial,sans-serif" fill="#51685c">confiável</text><path d="M495 210.5H521" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M780 210.5H806" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M940.0 268V370" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M495 435.5H521" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M780 435.5H806" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1065 435.5H1091" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M940.0 493V518H370.0V595" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M495 660.5H521" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M780 660.5H806" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1065 660.5H1091" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1225.0 718V370" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1237.0" y="548.0" font-size="12" text-anchor="middle" font-family="Arial,sans-serif" fill="#335d48">retorno</text><path d="M1225.0 718V743H370.0V820" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M495 885.5H521" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M780 885.5H806" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1065 885.5H1091" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1225.0 493V145" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="1237.0" y="323.0" font-size="12" text-anchor="middle" font-family="Arial,sans-serif" fill="#335d48">visibilidade</text><text x="30" y="1051" font-size="14" font-family="Arial,sans-serif" fill="#4e6559">Setas representam a lógica do desenho. Não indicam conectores já ativos. Correção retorna à etapa responsável.</text></svg>