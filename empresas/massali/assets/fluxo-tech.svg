<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">Massali Tech — fluxo da operação por item</title><desc id="desc">Fluxo próprio da operadora · nem conclusão nem geração de obrigação executam transferência bancária</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#438369"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f5f7f1"/><text x="30" y="43" font-size="25" font-family="Arial,sans-serif" fill="#193d33" font-weight="700">Massali Tech — fluxo da operação por item</text><text x="30" y="74" font-size="16" font-family="Arial,sans-serif" fill="#536b60">Fluxo próprio da operadora · nem conclusão nem geração de obrigação executam transferência bancária</text><rect x="20" y="100" width="1400" height="205" rx="16" fill="#e7efdd"/><text x="40" y="133" font-size="16" font-family="Arial,sans-serif" fill="#284d3e" font-weight="700">PEDIDO E DISPONIBILIZAÇÃO</text><rect x="20" y="325" width="1400" height="205" rx="16" fill="#e0eeed"/><text x="40" y="358" font-size="16" font-family="Arial,sans-serif" fill="#284d3e" font-weight="700">EXECUÇÃO POR ITEM</text><rect x="20" y="550" width="1400" height="205" rx="16" fill="#e8e8f6"/><text x="40" y="583" font-size="16" font-family="Arial,sans-serif" fill="#284d3e" font-weight="700">ENCERRAMENTO E EFEITOS</text><rect x="245" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="261" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Registrar pedido</text><text x="261" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Concessionária, veículo,</text><text x="261" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">itens e prazo</text><rect x="530" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="546" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Conferir viabilidade</text><text x="546" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Administrativo valida</text><text x="546" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">contexto e oferta</text><rect x="815" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="831" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Liberar serviço</text><text x="831" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Comando autorizado e versão</text><text x="831" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">esperada</text><rect x="1100" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="1116" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Disponibilizar oferta</text><text x="1116" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Categoria, acesso e</text><text x="1116" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">capacidade elegíveis</text><rect x="245" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="261" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Aceitar / atribuir</text><text x="261" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Solo ou equipe válida; sem</text><text x="261" y="455" font-size="14" font-family="Arial,sans-serif" fill="#51685c">aceite duplo</text><rect x="530" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="546" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Iniciar serviço</text><text x="546" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Aceite e início têm marcos</text><text x="546" y="455" font-size="14" font-family="Arial,sans-serif" fill="#51685c">próprios</text><rect x="815" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="831" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Registrar evidências</text><text x="831" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Antes/depois, autoria, hash e</text><text x="831" y="455" font-size="14" font-family="Arial,sans-serif" fill="#51685c">horário</text><rect x="1100" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="1116" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Concluir item</text><text x="1116" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Demais itens seguem seu</text><text x="1116" y="455" font-size="14" font-family="Arial,sans-serif" fill="#51685c">próprio estado</text><rect x="245" y="603" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="261" y="633" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Conferir conjunto</text><text x="261" y="660" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Concluídos/cancelados;</text><text x="261" y="680" font-size="14" font-family="Arial,sans-serif" fill="#51685c">motivos preservados</text><rect x="530" y="603" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="546" y="633" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Apurar remuneração</text><text x="546" y="660" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Regra vigente, crédito, meta</text><text x="546" y="680" font-size="14" font-family="Arial,sans-serif" fill="#51685c">e competência</text><rect x="815" y="603" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="831" y="633" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Cobrar / programar</text><text x="831" y="660" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Aceite, recebíveis e</text><text x="831" y="680" font-size="14" font-family="Arial,sans-serif" fill="#51685c">obrigações separados</text><rect x="1100" y="603" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="1116" y="633" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Confirmar e analisar</text><text x="1116" y="660" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Pagamento/recebimento</text><text x="1116" y="680" font-size="14" font-family="Arial,sans-serif" fill="#51685c">efetivos; margem</text><path d="M495 210.5H521" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M780 210.5H806" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1065 210.5H1091" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1225.0 268V293H370.0V370" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M495 435.5H521" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M780 435.5H806" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1065 435.5H1091" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1225.0 493V518H370.0V595" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M495 660.5H521" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M780 660.5H806" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1065 660.5H1091" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="826" font-size="14" font-family="Arial,sans-serif" fill="#4e6559">Setas representam a lógica do desenho. Não indicam conectores já ativos. Correção retorna à etapa responsável.</text></svg>