<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc"><title id="title">Linha do Tempo — fluxo completo por veículo</title><desc id="desc">Fluxo próprio por veículo · serviços e tarefas são controles distintos; retorno de correção segue regra e evidência</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#438369"/></marker></defs><rect width="100%" height="100%" rx="24" fill="#f5f7f1"/><text x="30" y="43" font-size="25" font-family="Arial,sans-serif" fill="#193d33" font-weight="700">Linha do Tempo — fluxo completo por veículo</text><text x="30" y="74" font-size="16" font-family="Arial,sans-serif" fill="#536b60">Fluxo próprio por veículo · serviços e tarefas são controles distintos; retorno de correção segue regra e evidência</text><rect x="20" y="100" width="1400" height="205" rx="16" fill="#e7efdd"/><text x="40" y="133" font-size="16" font-family="Arial,sans-serif" fill="#284d3e" font-weight="700">PREPARAR A EXECUÇÃO</text><rect x="20" y="325" width="1400" height="205" rx="16" fill="#e0eeed"/><text x="40" y="358" font-size="16" font-family="Arial,sans-serif" fill="#284d3e" font-weight="700">EXECUTAR E REGISTRAR</text><rect x="20" y="550" width="1400" height="205" rx="16" fill="#e8e8f6"/><text x="40" y="583" font-size="16" font-family="Arial,sans-serif" fill="#284d3e" font-weight="700">CONFERIR, CORRIGIR E ENTREGAR</text><rect x="245" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="261" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Identificar veículo</text><text x="261" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Loja, identificação, prazo e</text><text x="261" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">custódia</text><rect x="530" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="546" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Definir serviços</text><text x="546" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Película, bancos e carpete do</text><text x="546" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">exemplo</text><rect x="815" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="831" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Aplicar fluxo publicado</text><text x="831" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Snapshot de versão e</text><text x="831" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">responsáveis</text><rect x="1100" y="153" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="1116" y="183" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Liberar tarefas elegíveis</text><text x="1116" y="210" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Dependências e condições</text><text x="1116" y="230" font-size="14" font-family="Arial,sans-serif" fill="#51685c">avaliadas</text><rect x="245" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="261" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Assumir tarefa interna</text><text x="261" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Aceite do workflow registra</text><text x="261" y="455" font-size="14" font-family="Arial,sans-serif" fill="#51685c">início</text><rect x="530" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="546" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Executar em paralelo</text><text x="546" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Tarefas independentes podem</text><text x="546" y="455" font-size="14" font-family="Arial,sans-serif" fill="#51685c">avançar</text><rect x="815" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="831" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Responder e concluir</text><text x="831" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Formulário validado e autoria</text><rect x="1100" y="378" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="1116" y="408" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Reavaliar dependentes</text><text x="1116" y="435" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Obrigatórias precisam estar</text><text x="1116" y="455" font-size="14" font-family="Arial,sans-serif" fill="#51685c">concluídas</text><rect x="245" y="603" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="261" y="633" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Conferir condições</text><text x="261" y="660" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Checklist físico e documental</text><text x="261" y="680" font-size="14" font-family="Arial,sans-serif" fill="#51685c">definido</text><rect x="530" y="603" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="546" y="633" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Tratar correção</text><text x="546" y="660" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Reabre responsáveis; preserva</text><text x="546" y="680" font-size="14" font-family="Arial,sans-serif" fill="#51685c">respostas</text><rect x="815" y="603" width="250" height="115" rx="12" fill="white" stroke="#94ad9b"/><text x="831" y="633" font-size="17" font-family="Arial,sans-serif" fill="#183d30" font-weight="700">Aprovar conferência</text><text x="831" y="660" font-size="14" font-family="Arial,sans-serif" fill="#51685c">Só sem pendências</text><text x