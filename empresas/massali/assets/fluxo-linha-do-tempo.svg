35d48">retomar</text><path d="M1065 660.5H1091" stroke="#438369" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="826" font-size="14" font-family="Arial,sans-serif" fill="#4e6559">Setas representam a lógica do desenho. Não indicam conectores já ativos. Correção retorna à etapa responsável.</text></svg>