<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1320" viewBox="0 0 1920 1320"><defs><marker id="83bfff" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#83bfff" stroke-width="1.4"/></marker><marker id="7bd6ad" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7bd6ad" stroke-width="1.4"/></marker><marker id="f0c479" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#f0c479" stroke-width="1.4"/></marker><marker id="697a8e" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#697a8e" stroke-width="1.4"/></marker><marker id="edf2f7" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#edf2f7" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#11161d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="55" y="35.0" fill="#83bfff" font-size="18" dominant-baseline="hanging">01 / VISÃO DO PROJETO</text><text x="55" y="72.0" fill="#edf2f7" font-size="39" dominant-baseline="hanging">Dois mundos conectados pela jornada de cada veículo</text><text x="55" y="128.0" fill="#aebdce" font-size="21" dominant-baseline="hanging">Visão a construir e validar ao longo do MVP — não representa tudo já implementado.</text><rect x="55" y="205" width="300" height="215" rx="16" fill="#172331" stroke="#edf2f7" stroke-width="2" /><text x="79" y="227.0" fill="#edf2f7" font-size="27" dominant-baseline="hanging">COMPRADOR</text><text x="79" y="275.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Compra o veículo</text><text x="79" y="304.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Recebe a promessa</text><text x="79" y="334.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Acompanha informações</text><text x="79" y="364.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Avalia a experiência</text><rect x="410" y="205" width="1030" height="215" rx="16" fill="#172331" stroke="#83bfff" stroke-width="2" /><text x="434" y="227.0" fill="#83bfff" font-size="27" dominant-baseline="hanging">HUB + PÓS-VENDA  |  mundo da concessionária</text><text x="434" y="275.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Grupo → concessionárias → departamentos e responsáveis</text><text x="434" y="304.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">BYD • GWM • JEEP • FORD  |  marcas de referência</text><text x="434" y="334.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Visão por veículo e visão consolidada das entregas</text><text x="434" y="364.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">O que falta? Quem deve agir? Qual é o prazo?</text><path d="M 355 285 L 400 285" fill="none" stroke="#edf2f7" stroke-width="2.5" marker-end="url(#edf2f7)"/><text x="445" y="448.0" fill="#83bfff" font-size="19" dominant-baseline="hanging">Solicitação, especificação e prazo</text><path d="M 425 420 L 425 495" fill="none" stroke="#83bfff" stroke-width="2.5" marker-end="url(#83bfff)"/><text x="940" y="448.0" fill="#7bd6ad" font-size="19" dominant-baseline="hanging">Status, responsáveis e evidências</text><path d="M 1270 495 L 1270 420" fill="none" stroke="#7bd6ad" stroke-width="2.5" marker-end="url(#7bd6ad)"/><rect x="410" y="505" width="1030" height="235" rx="16" fill="#172331" stroke="#83bfff" stroke-width="2" /><text x="435" y="525.0" fill="#83bfff" font-size="28" dominant-baseline="hanging">UMA LINHA DO TEMPO POR VEÍCULO</text><text x="445" y="590.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Pedido</text><path d="M 470 642 L 610 642" fill="none" stroke="#83bfff" stroke-width="2.5" marker-end="url(#83bfff)"/><text x="600" y="590.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Aceite</text><path d="M 625 642 L 760 642" fill="none" stroke="#83bfff" stroke-width="2.5" marker-end="url(#83bfff)"/><text x="750" y="590.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Início</text><path d="M 775 642 L 910 642" fill="none" stroke="#83bfff" stroke-width="2.5" marker-end="url(#83bfff)"/><text x="900" y="590.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Conclusão</text><path d="M 925 642 L 1080 642" fill="none" stroke="#83bfff" stroke-width="2.5" marker-end="url(#83bfff)"/><text x="1070" y="590.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Conferência</text><path d="M 1095 642 L 1275 642" fill="none" stroke="#83bfff" stroke-width="2.5" marker-end="url(#83bfff)"/><text x="1265" y="590.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Entrega</text><text x="435" y="690.0" fill="#aebdce" font-size="20" dominant-baseline="hanging">Serviços podem ocorrer em paralelo • cada evento tem origem e responsável</text><path d="M 600 740 L 600 810" fill="none" stroke="#83bfff" stroke-width="2.5" marker-end="url(#83bfff)"/><path d="M 1270 810 L 1270 740" fill="none" stroke="#7bd6ad" stroke-width="2.5" marker-end="url(#7bd6ad)"/><rect x="410" y="820" width="1030" height="230" rx="16" fill="#172331" stroke="#7bd6ad" stroke-width="2" /><text x="434" y="842.0" fill="#7bd6ad" font-size="27" dominant-baseline="hanging">TECH  |  mundo dos prestadores</text><text x="434" y="890.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Operadoras → líderes e executores → serviços por item</text><text x="434" y="919.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Películas nos vidros • tapeçaria de bancos e carpete</text><text x="434" y="949.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Viabilidade → aceite → início → conclusão com evidências</text><text x="434" y="979.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Custos, comissões e premiações em seu próprio domínio</text><rect x="55" y="505" width="300" height="235" rx="16" fill="#172331" stroke="#83bfff" stroke-width="2" /><text x="79" y="527.0" fill="#83bfff" font-size="27" dominant-baseline="hanging">BRENO  |  PM</text><text x="79" y="575.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Traduz as necessidades</text><text x="79" y="604.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Organiza as decisões</text><text x="79" y="634.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Alinha os dois mundos</text><text x="79" y="664.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Coordena escopo e aceite</text><rect x="55" y="820" width="300" height="230" rx="16" fill="#172331" stroke="#aebdce" stroke-width="2" /><text x="79" y="842.0" fill="#aebdce" font-size="27" dominant-baseline="hanging">BASE TÉCNICA</text><text x="79" y="890.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">João e desenvolvimento</text><text x="79" y="919.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Dois projetos no Git</text><text x="79" y="949.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Regras e acessos</text><text x="79" y="979.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Integração a construir</text><path d="M 355 935 L 400 935" fill="none" stroke="#697a8e" stroke-width="2.5" marker-end="url(#697a8e)"/><rect x="1490" y="205" width="375" height="215" rx="16" fill="#172331" stroke="#83bfff" stroke-width="2" /><text x="1514" y="227.0" fill="#83bfff" font-size="27" dominant-baseline="hanging">PROMESSA DE ENTREGA</text><text x="1514" y="275.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Prazo combinado</text><text x="1514" y="304.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Pendências visíveis</text><text x="1514" y="334.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Ações e responsáveis</text><text x="1514" y="364.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Condições conferidas</text><path d="M 1440 310 L 1480 310" fill="none" stroke="#83bfff" stroke-width="2.5" marker-end="url(#83bfff)"/><rect x="1490" y="505" width="375" height="275" rx="16" fill="#172331" stroke="#7bd6ad" stroke-width="2" /><text x="1514" y="527.0" fill="#7bd6ad" font-size="27" dominant-baseline="hanging">CHECKLIST COM FOTOS</text><text x="1514" y="575.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Estepe • macaco</text><text x="1514" y="604.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Chave de roda</text><text x="1514" y="634.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Laterais • frente • traseira</text><text x="1514" y="664.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Bancos • carpete • película</text><text x="1514" y="693.8" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Conferência e recebimento</text><text x="1514" y="723.5" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Não aplicável justificado</text><path d="M 1440 620 L 1480 620" fill="none" stroke="#7bd6ad" stroke-width="2.5" marker-end="url(#7bd6ad)"/><rect x="1490" y="850" width="375" height="200" rx="16" fill="#172331" stroke="#83bfff" stroke-width="2" /><text x="1514" y="872.0" fill="#83bfff" font-size="24.772727272727273" dominant-baseline="hanging">EXPERIÊNCIA DO CLIENTE</text><text x="1514" y="920.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Entrega ao comprador</text><text x="1514" y="949.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Pesquisa interna</text><text x="1514" y="979.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging">CSAT / NPS</text><text x="1514" y="1009.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Aprendizado da operação</text><path d="M 1675 780 L 1675 840" fill="none" stroke="#7bd6ad" stroke-width="2.5" marker-end="url(#7bd6ad)"/><text x="415" y="1090.0" fill="#edf2f7" font-size="21" dominant-baseline="hanging">Massali Acessórios e Serviços participa da execução; a plataforma conecta os participantes.</text><text x="415" y="1130.0" fill="#83bfff" font-size="21" dominant-baseline="hanging">Objetivo: informação confiável do pedido à entrega, com visibilidade para cada público.</text><text x="55" y="1205.0" fill="#aebdce" font-size="20" dominant-baseline="hanging">Aceite ≠ início • serviço concluído ≠ veículo entregue • conclusão ≠ pagamento</text><text x="55" y="1232.0" fill="#aebdce" font-size="20" dominant-baseline="hanging">Pesquisa interna não é a nota oficial da montadora; melhoria de satisfação precisa ser medida.</text><text x="55" y="1270.0" fill="#aebdce" font-size="17" dominant-baseline="hanging">Massali • fase de MVP • 31/10/2026 • nomes comerciais ainda em definição</text></g></svg>