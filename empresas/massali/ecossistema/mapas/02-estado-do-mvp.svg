<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1320" viewBox="0 0 1920 1320"><defs><marker id="83bfff" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#83bfff" stroke-width="1.4"/></marker><marker id="7bd6ad" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7bd6ad" stroke-width="1.4"/></marker><marker id="f0c479" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#f0c479" stroke-width="1.4"/></marker><marker id="697a8e" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#697a8e" stroke-width="1.4"/></marker><marker id="edf2f7" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#edf2f7" stroke-width="1.4"/></marker></defs><rect width="100%" height="100%" fill="#11161d"/><g font-family="Segoe UI, Arial, sans-serif"><text x="55" y="35.0" fill="#83bfff" font-size="18" dominant-baseline="hanging">02 / ESTADO DO MVP</text><text x="55" y="72.0" fill="#edf2f7" font-size="39" dominant-baseline="hanging">O que encontramos nos dois repositórios</text><text x="55" y="128.0" fill="#aebdce" font-size="21" dominant-baseline="hanging">Retrato do código estudado em 31/10/2026 — sem execução dos sistemas ou comprovação de produção.</text><rect x="55" y="205" width="300" height="215" rx="16" fill="#172331" stroke="#aebdce" stroke-width="2" /><text x="79" y="227.0" fill="#aebdce" font-size="22.105263157894736" dominant-baseline="hanging">EVIDÊNCIA DO ESTUDO</text><text x="79" y="275.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Código + documentação</text><text x="79" y="304.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Rotas e regras centrais</text><text x="79" y="334.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Modelos de dados</text><text x="79" y="364.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Testes escritos consultados</text><rect x="410" y="205" width="1030" height="215" rx="16" fill="#172331" stroke="#7bd6ad" stroke-width="2" /><text x="434" y="227.0" fill="#7bd6ad" font-size="27" dominant-baseline="hanging">PÓS-VENDA  |  repositório massali-pos-venda</text><text x="434" y="275.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">NO CÓDIGO: veículos, lojas, serviços, responsáveis e prazos</text><text x="434" y="304.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Fluxos configuráveis, tarefas, dependências e histórico</text><text x="434" y="334.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Conferência e entrega separadas; pesquisas NPS / CSAT</text><text x="434" y="364.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Grupos cadastrados; isolamento operacional multigrupo pendente</text><rect x="1490" y="205" width="375" height="215" rx="16" fill="#172331" stroke="#f0c479" stroke-width="2" /><text x="1514" y="227.0" fill="#f0c479" font-size="27" dominant-baseline="hanging">LIMITES DO PÓS-VENDA</text><text x="1514" y="275.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Checklist: aprovação simples</text><text x="1514" y="304.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Fotos da jornada: pendentes</text><text x="1514" y="334.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Fila: sem envio externo</text><text x="1514" y="364.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Produção: por preparar</text><path d="M 1440 310 L 1480 310" fill="none" stroke="#f0c479" stroke-width="2.5" marker-end="url(#f0c479)"/><rect x="410" y="505" width="1030" height="235" rx="16" fill="#172331" stroke="#f0c479" stroke-width="2" stroke-dasharray="10 8"/><text x="435" y="527.0" fill="#f0c479" font-size="25" dominant-baseline="hanging">A PONTE ENTRE OS MUNDOS AINDA NÃO FOI IDENTIFICADA</text><text x="435" y="580.0" fill="#edf2f7" font-size="23" dominant-baseline="hanging">Há acompanhamento em cada base, mas não foi encontrada sincronização</text><text x="435" y="611.05" fill="#edf2f7" font-size="23" dominant-baseline="hanging">automática entre os serviços da Tech e a jornada do pós-venda</text><text x="435" y="642.1" fill="#edf2f7" font-size="23" dominant-baseline="hanging">nos caminhos examinados.</text><text x="435" y="690.0" fill="#f0c479" font-size="20" dominant-baseline="hanging">Faltam acordar identidades, eventos, responsáveis, evidências e tratamento de falhas.</text><path d="M 600 420 L 600 495" fill="none" stroke="#f0c479" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#f0c479)"/><path d="M 1270 495 L 1270 420" fill="none" stroke="#f0c479" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#f0c479)"/><path d="M 600 740 L 600 810" fill="none" stroke="#f0c479" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#f0c479)"/><path d="M 1270 810 L 1270 740" fill="none" stroke="#f0c479" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#f0c479)"/><rect x="410" y="820" width="1030" height="230" rx="16" fill="#172331" stroke="#7bd6ad" stroke-width="2" /><text x="434" y="842.0" fill="#7bd6ad" font-size="27" dominant-baseline="hanging">TECH  |  correspondência funcional com o repositório massali</text><text x="434" y="890.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">NO CÓDIGO: agendamentos e execução por item; portal do prestador</text><text x="434" y="919.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Liberação, capacidade, aceite, início e conclusão</text><text x="434" y="949.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Fotos Antes / Depois; remuneração e financeiro</text><text x="434" y="979.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Integração WhatsApp própria; isolamento por implantação dedicada</text><rect x="1490" y="820" width="375" height="230" rx="16" fill="#172331" stroke="#f0c479" stroke-width="2" /><text x="1514" y="842.0" fill="#f0c479" font-size="27" dominant-baseline="hanging">LIMITES DA TECH</text><text x="1514" y="890.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Fotos genéricas por item</text><text x="1514" y="919.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Obrigatoriedade a validar</text><text x="1514" y="949.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Regra nova de premiação</text><text x="1514" y="979.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">difere do motor atual</text><text x="1514" y="1008.8" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Produção depende da versão</text><path d="M 1440 930 L 1480 930" fill="none" stroke="#f0c479" stroke-width="2.5" marker-end="url(#f0c479)"/><rect x="55" y="505" width="300" height="235" rx="16" fill="#172331" stroke="#83bfff" stroke-width="2" /><text x="79" y="527.0" fill="#83bfff" font-size="27" dominant-baseline="hanging">BRENO  |  PM</text><text x="79" y="575.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Alinhar o significado</text><text x="79" y="604.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">dos estados e eventos</text><text x="79" y="634.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Registrar decisões</text><text x="79" y="664.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Definir cada incremento</text><rect x="55" y="820" width="300" height="230" rx="16" fill="#172331" stroke="#aebdce" stroke-width="2" /><text x="79" y="842.0" fill="#aebdce" font-size="26.25" dominant-baseline="hanging">BASES EXAMINADAS</text><text x="79" y="890.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">massali / main</text><text x="79" y="919.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">0c8cc2be</text><text x="79" y="949.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging"></text><text x="79" y="979.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">pós-venda / main</text><text x="79" y="1008.8" fill="#edf2f7" font-size="22" dominant-baseline="hanging">0387ed8b</text><rect x="1490" y="505" width="375" height="235" rx="16" fill="#172331" stroke="#f0c479" stroke-width="2" /><text x="1514" y="527.0" fill="#f0c479" font-size="27" dominant-baseline="hanging">DIFERENÇA DE ESTADOS</text><text x="1514" y="575.0" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Tech: aceite e início</text><text x="1514" y="604.7" fill="#edf2f7" font-size="22" dominant-baseline="hanging">são ações separadas.</text><text x="1514" y="634.4" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Tarefa configurável:</text><text x="1514" y="664.1" fill="#edf2f7" font-size="22" dominant-baseline="hanging">assumir já marca início.</text><text x="1514" y="693.8" fill="#edf2f7" font-size="22" dominant-baseline="hanging">Precisamos alinhar isso.</text><text x="415" y="1090.0" fill="#edf2f7" font-size="20" dominant-baseline="hanging">Verde = presente no código   •   Âmbar = parcial ou pendente   •   Tracejado = ligação a construir</text><text x="415" y="1130.0" fill="#83bfff" font-size="20" dominant-baseline="hanging">O avanço do MVP será definido por decisões e critérios de aceite, sem percentual fictício de conclusão.</text><text x="55" y="1205.0" fill="#aebdce" font-size="20" dominant-baseline="hanging">A Hub é a visão gerencial desejada; não foi identificado um terceiro repositório exclusivo.</text><text x="55" y="1232.0" fill="#aebdce" font-size="20" dominant-baseline="hanging">Código presente ≠ recurso homologado. Este retrato corresponde aos commits indicados, não a uma auditoria de produção.</text><text x="55" y="1270.0" fill="#aebdce" font-size="17" dominant-baseline="hanging">Massali • fase de MVP • 31/10/2026 • nomes comerciais ainda em definição</text></g></svg>