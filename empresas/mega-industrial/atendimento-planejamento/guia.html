function overview(){return `<div class="hero"><div><span class="eyebrow">Mega + GoFluxo / Guia de preenchimento</span><h1>Uma demanda.<br>Todo o caminho.</h1><p class="lead">Aprenda o que preencher, quem decide e como a informação conecta Atendimento, Planejamento e os ciclos de produção.</p><div class="actions"><button class="primary" onclick="go('atendimento')">Começar pelo Atendimento →</button><button class="quiet" onclick="go('exemplo')">Ver exemplo completo</button></div><p class="status">Configuração de referência: 12 de outubro de 2026.</p></div><div class="hero-visual"><span class="eyebrow">Três níveis do processo</span><div class="flow-line"><span class="n">01</span><div><strong>Cadastros</strong><small>Quem solicita, onde executar e qual contrato cobre.</small></div></div><div class="flow-line"><span class="n">02</span><div><strong>Estratégia</strong><small>Meta mensal por órgão e ciclo aprovado.</small></div></div><div class="flow-line"><span class="n">03</span><div><strong>Operação</strong><small>Qualificar, projetar, aprovar e liberar.</small></div></div><div class="stamp">O vínculo conecta os dados. A fase mostra o andamento.</div></div></div><div class="strip"><div><strong>2 pipes</strong><p>Atendimento e Planejamento</p></div><div><strong>8 databases</strong><p>Cadastros + referência + ciclos</p></div><div><strong>1 demanda conectada</strong><p>Não conte os dois cards como duas obras.</p></div></div><section class="section"><h2>Escolha por onde aprender.</h2><div class="grid">${[['atendimento','01 / Operação','Faço o atendimento','Da entrada à seleção do ciclo, com os campos de cada fase.'],['databases','02 / Cadastros','Atualizo as bases','Entenda onde manter contratos, metas e dados reutilizáveis.'],['planejamento','03 / Trabalho técnico','Faço o planejamento','Receba os dados, desenvolva o projeto e confira as decisões.']].map(([id,k,t,p])=>`<button class="tile" onclick="go('${id}')"><span class="eyebrow">${k}</span><h3>${t}</h3><p>${p}</p><span class="link">Abrir capítulo →</span></button>`).join('')}</div></section><div class="twocol"><div class="panel"><h3>As regras que orientam tudo</h3><ul><li>A planilha mãe é a referência oficial; “faturamento” nela significa meta de produção.</li><li>O valor integral pertence ao mês de início da obra.</li><li>Capacidade global: interna R$ 1,6 milhão/mês e terceirizada até R$ 1,4 milhão/mês.</li><li>Jedson valida ciclos e mudanças. Conselho autoriza pendências de contrato, aditivo ou OS antes da execução.</li></ul></div><div class="panel"><h3>Preencha uma vez. Confira sempre.</h3><p>Selecione cadastros existentes. No encaminhamento, a automação transfere onze campos para o Planejamento.</p><p>Os papéis de cadastro e registro descritos aqui são orientações operacionais; as permissões de acesso precisam seguir a definição interna da Mega.</p><p>Exemplos são didáticos e não registram dados nem aprovam obras no Pipefy.</p></div></div>`+note('Estado atual do piloto','O ciclo 2026 | 4º trimestre está Aguardando validação. Foi carregada apenas a referência piloto 2026-11 | SEDUC — PI, de R$ 320.199,39. Os cards anteriores são de validação.')}
function databases(){let d=D.dbs[state.db];return head('03','O dado certo, na base certa.','Databases guardam registros reutilizáveis. Cards representam o trabalho de uma demanda; não precisam reproduzir todos os dados do cadastro.')+`<div class="chips" aria-label="Escolher database">${D.dbs.map((x,i)=>`<button class="${state.db===i?'active':''}" onclick="state.db=${i};render()">${esc(x.name)}</button>`).join('')}</div><article class="panel"><span class="eyebrow">GOFLUXO DB</span><h2 style="margin-top:12px">${esc(d.name)}</h2><p>${esc(d.purpose)}</p><p class="owner"><strong>Quem mantém:</strong> ${esc(d.owner)}<br><strong>Quando:</strong> ${esc(d.when)}</p><a href="https://app.pipefy.com/databases/${d.url}" target="_blank" rel="noopener">Abrir database no Pipefy ↗</a><div class="gate"><strong>Efeito no processo:</strong> ${esc(d.impact)}</div>${d.fields.map(x=>field(x,d.owner)).join('')}</article>`+note('Como selecionar um vínculo','Abra o controle de conexão, pesquise e selecione o registro existente. O Pipefy pode exibir “Criar registro” ou “Create record” mesmo quando o controle abre a busca. Confira o registro escolhido antes de salvar.')+note('Cadastros ainda precisam de conferência','PREFEITURA no PDF não foi confirmada como SEGOR (FORTALEZA). SEADA/SADA e PRIVADOS ainda precisam de classificação/cadastro. Não trate nomes parecidos como equivalentes.',true)}
const relations=[['Órgãos e Secretarias','Cadastro compartilhado','O mesmo órgão conecta unidades, solicitantes, contratos e a referência mensal. Confira a UF: SEDUC PI e SEDUC CE são registros distintos.'],['Unidade + contrato','Identidade e cobertura','A unidade identifica o local. O contrato identifica a cobertura legal e o saldo consultado. Eles são selecionados no Atendimento; não são fases sucessivas.'],['Referência mensal','Estratégia por órgão e mês','A referência guarda a meta original e a previsão atualizada. O Atendimento seleciona esse registro e o Planejamento recebe o vínculo. Não se digita a meta em cada card.'],['Ciclo trimestral','Período e validação','A referência aponta para o ciclo. O ciclo guarda capacidades globais e a decisão de Jedson. Não existe um campo separado de trimestre a preencher em cada demanda.'],['Atendimento','Card de origem','Qualifica a mesma demanda que chegará ao Planejamento. Ao entrar em Enviada ao Planejamento, a automação consulta o ciclo aprovado e a data preenchida.'],['Planejamento','Card conectado','Recebe onze campos e o vínculo à origem. O projeto, documentos e aprovações são registrados aqui. A fase final libera o planejamento, sem comprovar produção física.']];
function connections(){return head('05','A informação segue com a demanda.','Veja a diferença entre vínculos, transferência automática e decisões humanas. Clique em um elemento do mapa para entender sua função.')+`<div class="map-grid">${relations.map((x,i)=>`<button class="map-node" onclick="showRelation(${i})"><span>${esc(x[1])}</span><strong>${esc(x[0])}</strong></button>`).join('')}</div><div id="relation" class="relation" aria-live="polite"><small>VÍNCULOS DO MODELO</small><h3>Órgão → referência mensal → ciclo</h3><p>Atendimento seleciona unidade, contrato e referência. Planejamento recebe esses vínculos pela automação de criação do card.</p></div><section class="section"><h2>O que já é automático</h2><div class="twocol"><div class="panel"><h3>Evento e condições</h3><ol><li>Card entra em <strong>Enviada ao Planejamento</strong>.</li><li>A decisão do ciclo vinculado é <strong>Aprovado</strong>.</li><li><strong>Início previsto da obra</strong> está preenchido.</li><li>A automação cria um card conectado no Planejamento.</li></ol><p>A seleção da referência precisa corresponder ao mês da data; essa igualdade ainda exige conferência humana.</p></div><div class="panel"><h3>Onze campos transferidos</h3><p>Órgão / Secretaria; Unidade; Solicitante; Necessidade solicitada; Estimativa inicial; Encaminhado por; Observação; Contrato relacionado; Referência mensal; Início previsto da obra; Prioridade.</p><p>Após a criação, alterações não têm sincronização contínua comprovada. Confira os dois cards ao corrigir os dados.</p></div></div></section><figure class="evidence"><img src="${A.conditions}" alt="Tela real da automação mostrando decisão do ciclo Aprovado e início previsto preenchido"><figcaption>Configuração conferida em 12/10/2026. Condições salvas; teste positivo com aprovação real de Jedson ainda pendente.</figcaption></figure>`+note('O que continua humano','Consulta do saldo no Excel, verificação de capacidade mensal, seleção dos vínculos, aprovações de Jedson e do órgão, decisão do Conselho e conferência final.')+note('Próximas entregas do projeto','Totais mensais/trimestrais, reserva e conciliação de saldo, painel executivo premium e alertas integrados ainda não estão implantados nesta estrutura.',true)}

const exampleSteps=[
 ['Cadastre a demanda','Uma unidade fictícia da SEDUC — PI solicita fachada e sinalização interna. No Atendimento, selecione órgão, unidade e solicitante existentes. Registre o escopo e uma estimativa fundamentada de R$ 200.000,00.','Atendimento / Formulário inicial','A estimativa não é saldo nem aceite.'],
 ['Faça a triagem','O órgão pede novembro. Confirme condições físicas, contato local e evidências. Registre a próxima ação se faltarem medidas. Não use a urgência para pular a qualificação.','Atendimento / Triagem da unidade','Prazo pretendido é diferente do início aprovado.'],

function example(){let x=exampleSteps[state.step];return head('06','Acompanhe uma unidade do início ao fim.','Exemplo fictício de demanda. A referência piloto SEDUC PI/novembro é real; valores de contrato, saldo e orçamento deste exercício são apenas didáticos.')+`<div class="steps" aria-label="Etapas do exemplo">${exampleSteps.map((x,i)=>`<button class="${state.step===i?'active':''}" onclick="state.step=${i};render()" aria-label="Etapa ${i+1}: ${esc(x[0])}">${i+1}</button>`).join('')}</div><div class="example-card"><div><span class="eyebrow">Passo ${state.step+1} de 9</span><h2>${x[0]}</h2><p>${x[1]}</p><div class="note warn"><strong>Ponto de atenção</strong><p>${x[3]}</p></div><div class="actions"><button class="quiet" onclick="state.step=Math.max(0,state.step-1);render()" ${state.step===0?'disabled':''}>← Anterior</button><button class="primary" onclick="state.step=Math.min(8,state.step+1);render()" ${state.step===8?'disabled':''}>Próximo passo →</button></div></div><div class="receipt"><span class="eyebrow">Ficha do exercício</span><dl><dt>Onde estamos</dt><dd>${x[2]}</dd><dt>Órgão</dt><dd>SEDUC — PI</dd><dt>Início previsto da obra</dt><dd>10/11/2026</dd><dt>Referência</dt><dd>2026-11 | SEDUC — PI</dd><dt>Valor didático da obra</dt><dd>R$ 200.000,00</dd><dt>Ciclo real do piloto</dt><dd>Aguardando validação</dd></dl></div></div><section class="section"><h2>Experimente a regra do mês de início.</h2><div class="simulator"><p>Simulação local: mudar a data muda o mês e o trimestre aos quais o valor integral pertence. Não grava nem calcula produção real no Pipefy.</p><div class="formgrid"><label>Início previsto da obra<input type="date" id="simDate" value="2026-11-10" oninput="simulate()"></label><label>Valor didático da obra (R$)<input type="number" min="0" step="0.01" id="simValue" value="200000" oninput="simulate()"></label></div><div id="simResult" class="result" aria-live="polite"></div></div></section>`}
function simulate(){let date=$('#simDate').value,value=Number($('#simValue').value);if(!date||!$('#simValue').value||!Number.isFinite(value)||value<0){$('#simResult').textContent='Informe uma data válida e um valor não negativo.';return}let [y,m]=date.split('-').map(Number);let month=new Intl.DateTimeFormat('pt-BR',{month:'long'}).format(new Date(y,m-1,1));$('#simResult').innerHTML=`<strong>${value.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})} em ${month} de ${y}</strong><p>${Math.ceil(m/3)}º trimestre · valor integral no mês de início · sem parcelas nos meses seguintes.</p>`}
function changes(){return head('07','Mudanças têm motivo e decisão.','O processo é dinâmico. Registre a proposta, preserve a meta original e confira os impactos antes de tratar a mudança como aprovada.')+`<div class="twocol"><div class="panel"><h3>Uma inauguração antecipou a obra</h3><ol><li>Registre a solicitação e a justificativa no card.</li><li>Confira o novo mês, saldo, OS e capacidade global.</li><li>Leve a alteração do ciclo a Jedson e registre a decisão real.</li><li>Após validação, atualize início previsto e referência mensal de forma coerente.</li><li>Confira o Planejamento conectado; a sincronização posterior não está comprovada.</li><li>Atualize a previsão correspondente sem apagar a meta original.</li></ol></div><div class="panel"><h3>Um órgão perdeu R$ 200 mil de demanda</h3><p>Não transfira saldo contratual de um órgão para outro. Uma compensação estratégica de produção precisa ter demanda, contrato, saldo e capacidade próprios no órgão que receberá a produção.</p><p>Preserve a meta original dos dois órgãos. Registre previsões propostas e motivo, obtenha validação de Jedson e mantenha evidências da revisão.</p><p>A mudança no total do trimestre precisa ser conferida também por mês.</p></div></div><section class="section"><h2>Quando não avançar</h2><div class="table-wrap"><table><thead><tr><th>Situação</th><th>Ação do colaborador</th><th>Por que importa</th></tr></thead><tbody><tr><td>Ciclo aguardando ou reprovado</td><td>Aguarde Jedson; revise conforme decisão.</td><td>A automação não atende à condição Aprovado.</td></tr><tr><td>Saldo vazio ou desatualizado</td><td>Peça consulta ao Atendimento e registre a data/OS.</td><td>Vazio não é zero; valor global não é saldo.</td></tr><tr><td>Sem contrato, aditivo ou OS</td><td>Mantenha a pendência e obtenha OK do Conselho antes de executar. Não invente contrato para avançar no campo obrigatório.</td><td>Demanda estratégica não é cobertura contratual.</td></tr><tr><td>Data e referência de meses diferentes</td><td>Corrija após conferir o período e a decisão aplicável.</td><td>A condição de data preenchida não verifica o mês do vínculo.</td></tr><tr><td>Card não criado no destino</td><td>Confira ciclo, data e histórico da automação. Acione o responsável pela configuração.</td><td>Reentradas podem gerar duplicidade; proteção não comprovada.</td></tr><tr><td>Orçamento acima da estimativa</td><td>Reavalie saldo e capacidade e solicite nova validação quando alterar o ciclo.</td><td>O orçamento muda o compromisso de produção.</td></tr></tbody></table></div></section>`+note('Como preservar o histórico com a estrutura atual','Em Motivo da alteração ou Registro da validação, registre data, antes/depois, justificativa, aprovador e referência da evidência. Use comentários do registro/card para manter revisões anteriores. Não há versionamento automático adicional implantado.')+note('Não confunda autorização com checkbox','Validação do ciclo e Liberação conferida registram conferência humana. Não criam uma decisão de Jedson nem substituem o OK do Conselho.',true)}
const questions=[
 ['A obra começa em novembro e continua em dezembro. Como alocar R$ 200 mil?',['R$ 100 mil em cada mês.','R$ 200 mil em novembro.','R$ 200 mil em cada mês.'],1,'O valor integral pertence ao mês de início da obra; continuidade física não cria outra parcela.'],
 ['O Excel já baixou a OS no saldo. O que registrar no Pipefy?',['O saldo atualizado, data da consulta e última OS considerada.','O saldo menos a mesma OS novamente.','O valor global como saldo.'],0,'O saldo informado pelo Atendimento já considera as OS. Descontar novamente reduz o saldo indevidamente.'],
 ['Um checkbox do Atendimento está marcado, mas o ciclo aguarda Jedson. O envio é liberado?',['Sim, o checkbox basta.','Sim, se a demanda for urgente.','Não; a automação consulta a decisão do ciclo vinculado.'],2,'A condição exige Decisão de Jedson = Aprovado na base Ciclos Trimestrais, além da data preenchida.'],
 ['A capacidade interna é de R$ 1,6 milhão. Como aplicar entre PI e CE?',['R$ 1,6 milhão para cada estado.','R$ 1,6 milhão por mês no total global.','R$ 1,6 milhão por órgão.'],1,'A capacidade é por equipe e independe do estado. O teto terceirizado também é global e depende de disponibilidade.'],
 ['Planejamento liberado significa o quê?',['Produção física concluída.','Compra de todos os materiais comprovada.','Planejamento conferido e liberado.'],2,'O encerramento deste pipe não comprova início ou conclusão física da obra nem compra realizada.'],
 ['Mudou a previsão de um órgão. O que fazer com a meta original?',['Preservar; registrar a revisão e a decisão de Jedson.','Substituir para eliminar o desvio.','Apagar o registro e criar outro sem histórico.'],0,'A meta original mantém a referência oficial. A previsão e o motivo mostram o que mudou e por quê.'],
 ['A demanda depende de OS. O que permite executar?',['A urgência informada pelo órgão.','O OK real do Conselho e a conferência da liberação aplicável.','O cadastro de um contrato fictício.'],1,'Demandas sem contrato ou dependentes de aditivo/OS só executam após OK do Conselho, conforme regra de Marina.']
];
function quiz(){return head('08','Você sabe quando seguir e quando esperar?','Responda a situações do dia a dia. O exercício acontece somente neste tutorial e não altera aprovações ou cards.')+questions.map((q,i)=>`<fieldset class="quiz"><legend>${i+1}. ${q[0]}</legend>${q[1].map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}">${a}</label>`).join('')}<div id="feedback${i}" aria-live="polite"></div></fieldset>`).join('')+`<button class="primary" onclick="checkQuiz()">Conferir respostas</button><div id="quizResult" class="status" aria-live="polite"></div>`}
function checkQuiz(){let score=0;questions.forEach((q,i)=>{let s=document.querySelector(`input[name=q${i}]:checked`),ok=s&&Number(s.value)===q[2];if(ok)score++;$('#feedback'+i).innerHTML=`<div class="feedback ${ok?'':'wrong'}"><strong>${ok?'Correto.':s?'Revise esta resposta.':'Escolha uma resposta.'}</strong> ${q[3]}</div>`});$('#quizResult').textContent=`${score} de ${questions.length} respostas corretas. Revise os comentários acima.`}
const glossary=[['Database','Cadastro de registros reutilizáveis: órgão, unidade, contrato, referência ou ciclo.'],['Pipe','Fluxo de trabalho com fases. Atendimento e Planejamento acompanham etapas da mesma demanda.'],['Card','Registro operacional de uma demanda dentro do pipe. O card conectado não representa uma segunda obra.'],['Campo de conexão','Escolha de um registro existente em outro cadastro; não é simples texto digitado.'],['Competência','Mês da referência. Para alocar o valor da obra, usa-se o mês do início previsto; isso não comprova início efetivo.'],['Meta original','Valor oficial da planilha mãe que deve ser preservado para comparação.'],['Previsão atualizada','Estimativa vigente do planejamento, separada da meta original e com mudanças validadas.'],['Saldo disponível','Saldo consultado pelo Atendimento após baixas por OS no controle Excel.'],['OS','Ordem de serviço. Sua emissão é considerada no controle do saldo; cadastrar o identificador não emite uma OS.'],['Aditivo','Instrumento que altera o contrato. Pedido de aditivo não significa cobertura aprovada.'],['Capacidade','Limite global mensal por equipe; não é meta, saldo ou produção realizada.'],['Ciclo','Trimestre de gestão que reúne referência, capacidade e decisão de Jedson.']];
function consultation(){return head('09','Encontre o campo que você precisa.','Pesquise pelo nome, finalidade ou orientação. Cada resultado mostra onde o campo está e como ele deve ser usado.')+`<label for="search" class="owner">Buscar em todos os pipes e databases</label><input class="searchbox" id="search" type="search" placeholder="Ex.: saldo, Conselho, início, referência…" oninput="searchFields()"><div id="searchResults"></div><section class="section"><h2>Glossário do processo</h2><div class="glossary">${glossary.map(([t,p])=>`<article><h3>${t}</h3><p>${p}</p></article>`).join('')}</div></section><p class="status">Fonte do guia: auditoria e configuração implantada em 12/10/2026, com regras confirmadas por Marina Teixeira. Após alterações no Pipefy, o tutorial deve ser revisado.</p>`}
function normalize(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function searchFields(){let q=normalize($('#search').value.trim());if(!q){$('#searchResults').innerHTML='<p class="owner">103 posições de campos documentadas: 29 no Atendimento, 33 no Planejamento e 41 nos databases. Campos transferidos aparecem nos dois pipes.</p>';return}let rows=[];for(let key of ['atendimento','planejamento'])D[key].forEach(g=>g.fields.forEach(x=>rows.push({x,where:`${key==='atendimento'?'Atendimento':'Planejamento'} / ${g.name}`,owner:g.owner})));D.dbs.forEach(d=>d.fields.forEach(x=>rows.push({x,where:`Database / ${d.name}`,owner:d.owner})));let found=rows.filter(r=>normalize(JSON.stringify(r)).includes(q));$('#searchResults').innerHTML=`<p class="owner">${found.length} resultado(s)</p>`+(found.length?found.map(r=>`<div class="panel" style="margin:12px 0"><span class="eyebrow">${esc(r.where)}</span>${field(r.x,r.owner)}</div>`).join(''):'<div class="empty">Nenhum campo encontrado. Tente outro nome ou consulte o capítulo correspondente.</div>')}
const pages={inicio:overview,atendimento:()=>pipeline('atendimento'),databases,planejamento:()=>pipeline('planejamento'),integracoes:connections,exemplo:example,mudancas:changes,exercicios:quiz,consulta:consultation};
function render(){if(!pages[state.page])state.page='inicio';nav();let idx=chapters.findIndex(x=>x[0]===state.page);$('#main').innerHTML=pages[state.page]()+`<footer class="chapter-end"><button class="quiet" id="completeBtn" onclick="complete()">${completed.includes(state.page)?'Capítulo concluído ✓':'Marcar capítulo como lido'}</button><small>O progresso é pessoal; não é uma aprovação operacional.</small>${idx<8?`<button class="secondary" onclick="go('${chapters[idx+1][0]}')">Próximo capítulo →</button>`:''}</footer>`;if(state.page==='exemplo')simulate();if(state.page==='consulta')searchFields()}
function printGuide(){let html='<h1>Guia operacional Mega Industrial</h1><p>Atendimento, Planejamento, databases e ciclos · configuração de 12/10/2026.</p>'+overview();html+='<section class="chapter"><h2>Atendimento — fases e campos</h2>'+D.atendimento.map((g,i)=>phase(g,i,true,'print-a')).join('')+'</section>';html+='<section class="chapter"><h2>Databases — campos e conexões</h2>'+D.dbs.map(d=>`<section class="section"><h3>${d.name}</h3><p>${d.purpose}</p><p>Quem mantém: ${d.owner}</p><p>Quando: ${d.when}</p><p>Efeito: ${d.impact}</p>${d.fields.map(x=>field(x,d.owner)).join('')}</section>`).join('')+'</section>';html+='<section class="chapter"><h2>Planejamento — fases e campos</h2>'+D.planejamento.map((g,i)=>phase(g,i,true,'print-p')).join('')+'</section><section class="chapter">'+connections()+'</section><section class="chapter"><h2>Demanda completa — exemplo didático</h2>'+exampleSteps.map((x,i)=>`<section class="section"><h3>${i+1}. ${x[0]}</h3><p>${x[1]}</p><p><strong>Onde:</strong> ${x[2]}</p><p><strong>Atenção:</strong> ${x[3]}</p></section>`).join('')+'</section><section class="chapter">'+changes()+'</section><section class="chapter"><h2>Exercícios e respostas</h2>'+questions.map(q=>`<h3>${q[0]}</h3><p><strong>Resposta:</strong> ${q[1][q[2]]}</p><p>${q[3]}</p>`).join('')+'</section><section class="chapter"><h2>Glossário</h2>'+glossary.map(([t,p])=>`<h3>${t}</h3><p>${p}</p>`).join('')+'</section>';$('#printContent').innerHTML=html;$('#printContent').querySelectorAll('details').forEach(d=>d.open=true);document.body.classList.add('print-view');window.scrollTo(0,0)}
render();
</script>
</body></html>
