<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fluxos RH Inteligente — Grupo Dimas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Montserrat:wght@700;800;900&display=swap');
*{box-sizing:border-box}html,body{margin:0;background:#dfe7ef;color:#12263d;font-family:Manrope,sans-serif}.sheet{width:1024px;height:1536px;background:#f8fafc;overflow:hidden;position:relative;padding:0 44px 34px}.top{height:180px;margin:0 -44px 30px;padding:34px 52px;background:#082f5f;color:white;position:relative}.top:after{content:"";position:absolute;left:0;bottom:0;width:100%;height:8px;background:#ee3124}.eyebrow{font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#ff746b;font-size:17px}.title{font:900 48px/1.05 Montserrat,sans-serif;margin:11px 0 10px;max-width:890px;letter-spacing:-.035em}.subtitle{font-size:20px;line-height:1.35;color:#d9e8f7;max-width:860px}.legend{display:flex;gap:18px;margin:0 0 24px;font-size:15px;font-weight:800}.pill{display:flex;align-items:center;gap:8px}.dot{width:13px;height:13px;border-radius:50%}.auto{background:#137e57}.manual{background:#ed3b32}.mixed{background:#e4a019}.flow{display:flex;flex-direction:column;gap:14px}.step{display:grid;grid-template-columns:82px 1fr;min-height:142px;background:white;border:1px solid #d7e1ea;box-shadow:0 7px 18px rgba(20,50,77,.07)}.num{background:#0d4e89;color:white;display:flex;align-items:center;justify-content:center;font:900 38px Montserrat}.body{padding:19px 23px}.row{display:flex;align-items:center;gap:12px;margin-bottom:8px}.mode{font-size:13px;font-weight:900;color:white;padding:5px 10px;text-transform:uppercase;letter-spacing:.08em}.mode.a{background:#137e57}.mode.m{background:#ed3b32}.mode.x{background:#e4a019}.step h2{font:800 23px/1.1 Montserrat;margin:0;color:#092f59}.step p{font-size:17px;line-height:1.42;margin:6px 0}.why{font-size:15px!important;color:#4a6075}.why b{color:#092f59}.callout{background:#fff0ee;border:2px solid #ee3124;padding:18px 22px;margin:18px 0 0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center}.callout strong{font:900 17px/1.08 Montserrat;color:#cf2117;overflow-wrap:anywhere}.callout p{min-width:0;margin:0;font-size:17px;line-height:1.4}.footer{position:absolute;bottom:0;left:0;right:0;height:54px;background:#082f5f;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 46px;font-size:14px}.footer b{letter-spacing:.08em}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:#eef4f8;padding:12px 14px;font-size:15px;line-height:1.35}.mini b{display:block;color:#0d4e89;margin-bottom:3px}.route{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}.route span{padding:7px 10px;background:#e9f1f7;font-weight:800;font-size:14px}.arrow{color:#ee3124;font-weight:900}.compact .step{min-height:120px}.compact .body{padding:15px 21px}.compact .step p{font-size:16px}.compact .step h2{font-size:21px}
</style></head><body><div style="position:relative;z-index:99999;background:#153e35;color:white;padding:12px 20px;font:14px system-ui"><a style="color:white" href="./">← Voltar ao projeto</a> · Mapa · Documento de referência; consultar a data e os limites da versão.</div><main id="app"></main>
<script>
const pages={
talentos:{k:'BANCO DE TALENTOS',t:'DO CURRÍCULO À CLASSIFICAÇÃO',s:'Como o cadastro é recebido, analisado pela IA e conectado às vagas.',steps:[
['m','FORMULÁRIO PÚBLICO','A pessoa preenche dados, CPF, nascimento, WhatsApp, e-mail, cidade(s), unidade, cargo principal, outros cargos, pretensão e anexa currículo somente em PDF.','Motivo: criar um cadastro padronizado e utilizável pela análise.'],
['a','CURRÍCULO RECEBIDO','O Pipefy cria o card original do candidato no Banco de Talentos. Esse cadastro não é movido para dentro de uma vaga.','Motivo: preservar uma fonte única da pessoa.'],
['a','ANÁLISE DA IA','A IA lê o currículo e preenche último cargo, experiência, formação, habilidades, resumo, pontos fortes, pontos de atenção, scores e laudo.','Motivo: transformar o currículo em evidências estruturadas.'],
['a','CLASSIFICAÇÃO AUTOMÁTICA','A Classificação Final posiciona o card em Alta Prioridade, Médio Potencial, Baixa Prioridade, Não Aderente ou Banco de Reserva.','Motivo: organizar a prioridade geral; não significa aprovação em uma vaga.'],
['a','CRUZAMENTO COM VAGAS ABERTAS','Cargo padronizado, requisitos comprovados, scores, cidade da unidade e mobilidade são comparados. Alta e Média podem gerar candidatura independente. Baixa não gera automaticamente.','Motivo: encontrar aderência real sem misturar cargos ou cidades.'],
['m','DECISÃO HUMANA PRESERVADA','O RH pode revisar o cadastro e incluir manualmente a pessoa em outra vaga. Cada combinação usa a chave candidateId:vacancyId e não duplica.','Motivo: a IA prioriza; o RH decide.'] ],call:['REGRA DE OURO','O card original permanece no Banco de Talentos. Para cada vaga é criada uma candidatura separada, com aderência, documentos e decisões próprios.']},
requisicao:{k:'REQUISIÇÃO DE VAGAS',t:'DA SOLICITAÇÃO À DECISÃO DO RH',s:'Como a necessidade do gestor nasce, é analisada e retorna ao solicitante.',steps:[
['m','SOLICITAÇÃO DA VAGA','O gestor preenche perfil, unidade, gestor, salário, benefícios, horário, escala, urgência, contrato, motivo, diferenciais e observações.','Motivo: registrar a necessidade com contexto suficiente.'],
['a','CRIAÇÃO CONECTADA','O Pipefy cria a requisição e um card correspondente em Recrutamento e Seleção — 01. Vaga Solicitada — mantendo os IDs de origem.','Motivo: permitir operação do RH sem perder a rastreabilidade.'],
['m','ANÁLISE DO RH','O RH confere perfil e unidade, define analista, data, observações, forma de divulgar salário e benefícios aprovados.','Motivo: validar coerência, orçamento e conteúdo da publicação.'],
['x','SE PRECISAR DE CORREÇÃO','RH informa motivo e orientações; a automação leva a requisição para Correção Solicitada. O solicitante corrige e envia para nova análise.','Motivo: devolver exatamente o que precisa ser ajustado e manter o ciclo visível.'],
['x','SE FOR REPROVADA','RH seleciona Reprovada e informa o motivo. A automação sincroniza a decisão e move a requisição para Vaga Reprovada.','Motivo: encerrar com justificativa rastreável para o solicitante.'],
['x','SE FOR APROVADA','RH confirma a aprovação. A automação sincroniza os dados, move a requisição para Vaga Aprovada e o recrutamento para Divulgação, onde prepara a publicação.','Motivo: uma única decisão atualiza os dois pipes.'] ],call:['VISÃO DO SOLICITANTE','O solicitante acompanha tudo no card original: fase atual, motivo e orientações de correção, situação da nova análise, aprovação ou motivo da reprovação.']},
geral:{k:'RECRUTAMENTO E SELEÇÃO',t:'VISÃO GERAL DO PROCESSO',s:'O que cada fase entrega e onde termina a automação.',steps:[
['x','01. VAGA SOLICITADA','RH analisa, aprova, reprova ou solicita correção. Decisão humana; sincronização automática com a requisição.','Resultado: vaga validada ou devolvida com orientação.'],
['a','02. DIVULGAÇÃO','Após aprovação, o sistema monta texto, escolhe o template da marca, gera e anexa o banner. O RH publica e decide quando avançar.','Resultado: material pronto e rastreável.'],
['x','03. TRIAGEM','IA cria candidaturas de Alta e Média aderência; RH pode adicionar manualmente e decide cada candidatura. A vaga permanece aqui até o RH concluir.','Resultado: grupo de aprovados definido.'],
['x','04. ENTREVISTA RH','RH move manualmente a vaga. A automação libera os aprovados, trata DISC e envia agendamento. Agenda sincroniza status, painel e etiquetas.','Resultado: entrevistas organizadas e visíveis.'],
['m','05. ENTREVISTA GESTOR','Etapa ainda em desenho operacional. Hoje o RH registra recebimento e anexa testes; decisão e comunicação serão homologadas depois.','Resultado atual: controle manual, sem automação inventada.'],
['m','06. VAGA FECHADA','O RH encerra a vaga após a decisão final e preserva candidaturas e histórico.','Resultado: processo concluído com rastreabilidade.'] ],call:['AUTOMAÇÃO NÃO CONTRATA','IA e integrações organizam, calculam aderência, criam candidaturas e enviam comunicações autorizadas. Aprovação, reprovação e avanço estratégico continuam humanos.']},
fase1:{k:'RECRUTAMENTO • FASE 01',t:'VAGA SOLICITADA',s:'A porta de entrada da análise do RH.',steps:[
['a','CARD NASCE CONECTADO','A requisição gera um card correspondente com IDs de origem, perfil e unidade.','Motivo: rastrear os dois lados do processo.'],
['m','RH CONFERE OS DADOS','Analisa cargo, unidade, salário, benefícios, jornada, urgência, contrato, perfil e justificativa.','Motivo: impedir divulgação com informação incompleta ou incoerente.'],
['m','RH ESCOLHE A DECISÃO','As opções são Aprovar, Solicitar Correção ou Reprovar. Motivos e orientações são obrigatórios quando aplicáveis.','Motivo: toda decisão precisa ser explicável.'],
['a','SISTEMA SINCRONIZA','Campos e decisão retornam para o card original da requisição.','Motivo: o solicitante acompanha sem acessar o pipe operacional.'],
['x','DESTINO','Aprovada → Divulgação. Correção → volta ao solicitante. Reprovada → encerrada como não aprovada.','Motivo: cada decisão abre somente o caminho correspondente.'] ],call:['RESPONSABILIDADE','A decisão é manual do RH. A cópia de dados, a movimentação entre os dois pipes e a rastreabilidade são automáticas.']},
fase2:{k:'RECRUTAMENTO • FASE 02',t:'DIVULGAÇÃO',s:'Da vaga aprovada ao material pronto para publicação.',steps:[
['a','VALIDAÇÕES DE ENTRADA','O sistema exige um perfil, uma unidade ativa, cidade/UF, marca e dados aprovados de salário e benefícios.','Motivo: evitar banners genéricos ou com dados errados.'],
['a','CONTEÚDO DA VAGA','Gera texto de divulgação e link de candidatura a partir dos dados aprovados.','Motivo: padronizar a comunicação.'],
['a','BANNER DA MARCA','Resolve a marca da unidade, escolhe o template homologado, gera a arte e a anexa ao card.','Motivo: manter identidade visual correta por empresa.'],
['a','PENDÊNCIAS VISÍVEIS','Se faltar dado ou houver limite visual, o erro é registrado em Pendências da divulgação; não há banner genérico silencioso.','Motivo: tornar a correção objetiva.'],
['m','PUBLICAÇÃO E AVANÇO','O RH publica nos canais, registra as publicações e move a vaga para Triagem quando decidir.','Motivo: arte pronta não significa publicação concluída.'] ],call:['CONTROLE','A geração é automática. A postagem e a decisão de encerrar a Divulgação são manuais do RH.']},
fase3:{k:'RECRUTAMENTO • FASE 03',t:'TRIAGEM',s:'Aderência automática, inclusão manual e decisão humana.',steps:[
['a','VARREDURA AUTOMÁTICA','Ao entrar em Triagem, o sistema cruza a vaga com o Banco de Talentos analisado. Novos candidatos também são comparados com vagas ainda abertas.','Motivo: não perder candidatos que chegam depois.'],
['a','CRITÉRIOS DE ADERÊNCIA','Compara Cargo/Vaga exato, requisitos com evidência, scores-base, cidade da unidade, cidades escolhidas e mobilidade.','Motivo: reduzir falsos positivos por palavra solta.'],
['a','CANDIDATURAS INDEPENDENTES','Alta e Média aderência criam candidaturas; Baixa não cria automaticamente. A chave candidateId:vacancyId impede duplicidade.','Motivo: uma pessoa pode concorrer a várias vagas sem misturar decisões.'],
['m','ADIÇÃO MANUAL','No campo Adicionar candidato manualmente, o RH escolhe uma pessoa. O sistema cria ou reutiliza a candidatura, recalcula aderência e preserva o cadastro original.','Motivo: aproveitar potencial percebido pelo recrutador.'],
['m','DECISÃO POR CANDIDATO','RH marca Aprovado, Standby ou Reprovado. Aprovar não move a vaga nem envia WhatsApp.','Motivo: permitir que o RH termine todo o grupo.'],
['m','LIBERAÇÃO DA ETAPA','Após concluir a análise, o RH move manualmente a vaga para Entrevista RH.','Motivo: esse movimento é o gatilho final dos aprovados.'] ],call:['REGRA PRINCIPAL','A IA recomenda e organiza. O RH decide cada candidatura e escolhe quando a vaga sai da Triagem.']},
fase4:{k:'RECRUTAMENTO • FASE 04',t:'ENTREVISTA RH',s:'Convites, DISC, agendamento e acompanhamento visual.',steps:[
['m','ENTRADA MANUAL DA VAGA','O RH move a vaga para Entrevista RH somente após concluir a triagem.','Motivo: liberar o grupo certo de aprovados.'],
['a','APROVADOS SÃO LIBERADOS','A automação move para Entrevista RH apenas candidaturas marcadas como aprovadas. Reprovados e Standby não recebem convite.','Motivo: respeitar as decisões individuais.'],
['a','REGRA DO DISC','DISC dispensado ou recebido → link de agenda. DISC pendente → aguarda o documento; quando recebido, o link é liberado automaticamente.','Motivo: manter a ordem correta sem mensagens duplicadas.'],
['a','WHATSAPP E GOOGLE AGENDA','O candidato recebe a identidade da empresa e o link. Ao reservar, recebe confirmação, data, horário e Google Meet.','Motivo: permitir autoagendamento com experiência padronizada.'],
['a','SINCRONIZAÇÃO A CADA 5 MINUTOS','No período operacional, o sistema atualiza candidatura, painel da vaga e etiquetas de agendados e pendentes. As duas etiquetas podem coexistir.','Motivo: dar visão imediata ao RH.'],
['m','DECISÃO DA ENTREVISTA','RH registra parecer e decide: aprovado para gestor, standby, reprovado ou não compareceu.','Motivo: a entrevista é uma decisão humana documentada.'] ],call:['PROTEÇÕES','Mensagens são idempotentes: reprocessar não envia novamente. A sincronização não inventa decisão e não altera candidatos fora desta vaga.']},
fase5:{k:'RECRUTAMENTO • FASE 05',t:'ENTREVISTA GESTOR',s:'Estado atual e limite da automação.',steps:[
['a','ENTRADA DO APROVADO','Ao RH aprovar para o gestor, a candidatura e a vaga podem avançar para esta fase.','Motivo: separar a avaliação do RH da decisão do gestor.'],
['m','COORDENAÇÃO COM O GESTOR','O modelo operacional de agenda, confirmação e comunicação ainda será definido em reunião.','Motivo: não automatizar uma regra de negócio ainda não homologada.'],
['m','TESTES E DOCUMENTOS','Hoje existem campos para Data do Recebimento dos Testes e Anexe os Testes Recebidos.','Motivo: centralizar evidências disponíveis enquanto o fluxo final é desenhado.'],
['m','PARECER E DECISÃO','O gestor e o RH conduzem a avaliação conforme orientação operacional vigente.','Motivo: manter responsabilidade humana.'],
['m','PRÓXIMO DESTINO','Depois da homologação, serão definidos gatilhos, mensagens, aprovações e passagem para Vaga Fechada.','Motivo: implementar somente o que estiver validado.'] ],call:['TRANSPARÊNCIA','Esta fase não deve ser apresentada como totalmente automatizada. O desenho definitivo ainda depende da reunião com o RH e os gestores.']},
fase6:{k:'RECRUTAMENTO • FASE 06',t:'VAGA FECHADA',s:'Encerramento e preservação do histórico.',steps:[
['m','DECISÃO DE ENCERRAR','O RH fecha a vaga após a conclusão das decisões e do processo definido.','Motivo: impedir encerramento automático sem confirmação humana.'],
['a','HISTÓRICO PRESERVADO','Conexões com requisição, candidaturas, documentos, decisões e registros permanecem disponíveis.','Motivo: auditoria e rastreabilidade.'],
['m','CANDIDATURAS INDIVIDUAIS','Cada candidatura conserva o seu resultado; o cadastro original continua no Banco de Talentos.','Motivo: possibilitar futuras oportunidades sem misturar processos.'],
['a','VAGA SAI DA VARREDURA','Vaga fechada deixa de receber novas candidaturas automáticas.','Motivo: impedir novos vínculos após o encerramento.'],
['m','REABERTURA NÃO PRESUMIDA','Uma nova necessidade deve seguir a regra operacional definida para nova requisição ou reabertura autorizada.','Motivo: manter controle e governança.'] ],call:['FIM DO CICLO','Fechar a vaga encerra a oportunidade, não apaga pessoas, candidaturas, pareceres ou evidências do processo.']}
};
const key=new URLSearchParams(location.search).get('page')||'geral',p=pages[key]||pages.geral;
const mode={a:['AUTOMÁTICO','a'],m:['MANUAL','m'],x:['MISTO','x']};
document.getElementById('app').innerHTML=`<section class="sheet ${p.steps.length>5?'compact':''}"><header class="top"><div class="eyebrow">${p.k}</div><h1 class="title">${p.t}</h1><div class="subtitle">${p.s}</div></header><div class="legend"><div class="pill"><i class="dot auto"></i>AUTOMÁTICO</div><div class="pill"><i class="dot manual"></i>MANUAL</div><div class="pill"><i class="dot mixed"></i>MISTO</div></div><div class="flow">${p.steps.map((s,i)=>`<article class="step"><div class="num">${i+1}</div><div class="body"><div class="row"><span class="mode ${mode[s[0]][1]}">${mode[s[0]][0]}</span><h2>${s[1]}</h2></div><p>${s[2]}</p><p class="why"><b>${s[3].split(':')[0]}:</b>${s[3].includes(':')?s[3].slice(s[3].indexOf(':')+1):''}</p></div></article>`).join('')}</div><aside class="callout"><strong>${p.call[0]}</strong><p>${p.call[1]}</p></aside><footer class="footer"><b>RH INTELIGENTE • GRUPO DIMAS</b><span>Ação • motivo • responsabilidade • resultado</span></footer></section>`;
</script></body></html>
